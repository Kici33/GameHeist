name: gameheist-observability
services:
  influxdb:
    image: influxdb:2.7.12
    ports:
      - '127.0.0.1:18086:8086'
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: heist
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?Set INFLUX_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: gameheist
      DOCKER_INFLUXDB_INIT_BUCKET: heist_metrics
      DOCKER_INFLUXDB_INIT_RETENTION: 168h
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN in .env}
    volumes:
      - influx-data:/var/lib/influxdb2
      - influx-config:/etc/influxdb2
    healthcheck:
      test: ['CMD', 'influx', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - '127.0.0.1:13000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: heist
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Set INFLUX_TOKEN in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
volumes:
  influx-data:
  influx-config:
  grafana-data:

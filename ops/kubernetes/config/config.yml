instances:
  maximum: 1
  fallback-world: world
network:
  role: backend
  # Overridden by HEIST_SERVER_ID from GameServer pod metadata.
  server-id: agones-placeholder
  arena: brasslock_bank
  arena-version: 1
  difficulty: NORMAL
resource-pack:
  # Supply your real pack, or explicitly enable bypass for a private Brasslock test.
  development-bypass: false
  id: '873f1299-715e-430a-ae57-a43b96f20e92'
  # Replace both placeholders together; Fleet annotations must carry the same immutable identity.
  url: 'https://assets.example.invalid/gameheist-brasslock-1.2.zip'
  sha1: '0000000000000000000000000000000000000000'
  timeout-seconds: 60
health:
  enabled: true
  bind-address: '0.0.0.0'
  port: 8081
  stale-after-seconds: 15
storage:
  mode: mongodb
  database: gameheist
metrics:
  # Enable only after providing the reachable Influx origin and secret token.
  enabled: false
  url: 'http://influxdb:8086'
  organization: gameheist
  bucket: heist_metrics
  server-id: kubernetes

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameheist
spec:
  # Explicitly opt in after reviewing EULA, secrets, pack, image, and sizing.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gameheist
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gameheist
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 1300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gameheist
          image: gameheist:26.1.2-dev
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          env:
            - name: EULA
              value: 'false'
            - name: HEIST_DRAIN_TIMEOUT_SECONDS
              value: '1250'
            - name: HEIST_SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEIST_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: gameheist-secrets
                  key: mongodb-uri
            - name: HEIST_DRAIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gameheist-secrets
                  key: drain-token
            - name: HEIST_INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gameheist-secrets
                  key: influx-token
                  optional: true
          ports:
            - name: minecraft
              containerPort: 25565
            - name: health
              containerPort: 8081
          resources:
            requests:
              cpu: '1'
              memory: 2Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: '2'
              memory: 3Gi
              ephemeral-storage: 4Gi
          startupProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /live
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
            timeoutSeconds: 1
          lifecycle:
            preStop:
              exec:
                command:
                  - java
                  - -Xmx32m
                  - -cp
                  - /opt/gameheist/gameheist.jar
                  - dev.gameheist.runtime.health.DrainHook
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
            - name: configuration
              mountPath: /config
              readOnly: true
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 3Gi
        - name: temporary
          emptyDir:
            sizeLimit: 256Mi
        - name: configuration
          configMap:
            name: gameheist-config

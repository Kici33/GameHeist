apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gameheist
resources:
  - namespace.yaml
  - service-account.yaml
  - allocator-rbac.yaml
  - fleet.yaml
  - network-policy.yaml
configMapGenerator:
  - name: gameheist-config-v4-replace-with-git-sha
    files:
      - config/config.yml
      - config/server.properties
      - config/paper-global.yml
      - config/spigot.yml
      - config/whitelist.json
      - config/ops.json
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: gameheist
    app.kubernetes.io/managed-by: kustomize
patches:
  - target:
      kind: ConfigMap
      name: gameheist-config-v4-replace-with-git-sha
    patch: |-
      - op: add
        path: /immutable
        value: true

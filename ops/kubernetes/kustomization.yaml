apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gameheist
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: gameheist-config
    files:
      - config/config.yml
      - config/server.properties
      - config/whitelist.json
      - config/ops.json

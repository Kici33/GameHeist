apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gameheist-backend-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: match-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              gameheist.dev/proxy: 'true'
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
      ports:
        - protocol: TCP
          port: 25565
